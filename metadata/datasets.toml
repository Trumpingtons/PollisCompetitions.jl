# The Dataset Catalog of PollisCompetitions.jl: one [[datasets]] table for each dataset, with its references.
# A field left out is unknown, and loads as NULL (missing in Julia).
#
#   dataset_id        the key
#   dataset_name      its name
#   competition_name  the competition it comes from, with competition_year; both or neither
#   topic             its subject
#   data_structure    Cross-section | Time-Series | Panel (spatial panels and multi-level longitudinal data included)
#   geometry          None | Spatial Weights Matrix | Coordinates | Polygons, from the poorest to the richest
#   response_type     Binary | Multiclass | Ordered | Count | Survival | Regression
#   rows              rows of the data as stored (for a panel, one for each unit and time)
#   features          columns other than the response and the identifiers
#   size_mb           size of its Parquet files
#   licence           the licence of the data
#   delivery          Built-in (ships with the package) | Download (fetched by the user)
#   source_url        where the data come from
#
# [[datasets.references]] are its references: bibtex_key, a key of PollisReferences, and role, one of
# Primary | Competition | Benchmark | Other.


