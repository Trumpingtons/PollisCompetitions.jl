# The Model Catalog of PollisCompetitions.jl: one [[models]] table for each model, with its references.
# A field left out is unknown, and loads as NULL (missing in Julia).
#
#   model_id          the key
#   model_name        its name
#   estimator_family  the family of its estimator, one of those below: the model types of TabArena, Statistical for
#                     the classical methods of forecasting and of survival analysis, Kernel Methods, Fuzzy System, and
#                     Hybrid for a model that combines methods of different kinds
#   estimator_method  the method it estimates with, one of those of its family; that of a Hybrid model names the
#                     methods it combines:
#     Foundation Model  Pretrained in-context learner | Pretrained hypernetwork | Fine-tuned pretrained transformer |
#                       Pretrained time-series forecaster
#     Tree-based        Gradient-boosted trees | Randomized tree ensemble | Generalized additive model | Decision tree
#     Neural Network    Multilayer perceptron | Ensemble of multilayer perceptrons | Neural nearest neighbours |
#                       Recurrent neural network | Convolutional neural network | Transformer | Functional network |
#                       Adaptive logic network | Autoencoder | Other neural network
#     Baseline          Nearest neighbours | Penalized linear model | Linear regression | Polynomial regression |
#                       Naive forecast | Time series decomposition | Nonparametric survival estimator
#     Statistical       Exponential smoothing | Theta method | ARIMA | Automatic model selection |
#                       Other statistical method | Proportional hazards model | Accelerated failure time model |
#                       Flexible parametric survival model
#     Kernel Methods    Support vector machine | Kernel adaptive filtering | Feature-learning kernel machine
#     Fuzzy System      Fuzzy rule-based system | Neuro-fuzzy system | Fuzzy time series | Fuzzy transform |
#                       Association rules
#     Hybrid            Neural networks, Gaussian processes | Neural networks, Gaussian processes, Linear models |
#                       Time series decomposition, Neural networks, Theta method |
#                       Self-organising maps, Empirical orthogonal functions |
#                       Nearest neighbours, Support vector machines | Neural networks, Model trees |
#                       Neural networks, Nearest neighbours |
#                       Neural networks, Nearest neighbours, Statistical methods |
#                       Neural networks, Exponential smoothing | Fuzzy time series, Exponential smoothing |
#                       Fuzzy time series, ARIMA | Self-organising maps, Multivariate adaptive regression splines |
#                       Self-organising maps, Intervention analysis | Neural networks, Fuzzy logic |
#                       Statistical methods, Fuzzy logic
#     Other             Piecewise linear regression | Componentwise boosting
#   package           the package that implements it
#   language          Julia | Python | R | C/C++ | Fortran
#
# [[models.references]] are its references: bibtex_key, a key of PollisReferences, and role, one of
# Methodology | Software | Other.

# TabArena: the 110 models of its leaderboard, each in its configuration: default, tuned, or tuned and
# ensembled. The family is TabArena's model type, with xRFM under Kernel Methods; the package is the one TabArena runs
# the model with, else the code its paper published.

