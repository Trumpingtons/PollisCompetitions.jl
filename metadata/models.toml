# The Model Catalog of PollisCompetitions.jl: one [[models]] table for each model, with its references.
# A field left out is unknown, and loads as NULL (missing in Julia).
#
#   model_id          the key
#   model_name        its name
#   estimator_family  the family of its estimator, one of those below: the model types of TabArena, and Statistical
#                     for the classical methods of forecasting
#   estimator_method  the method it estimates with, one of those of its family:
#     Foundation Model  Pretrained in-context learner | Pretrained hypernetwork | Fine-tuned pretrained transformer |
#                       Pretrained time-series forecaster
#     Tree-based        Gradient-boosted trees | Randomized tree ensemble | Generalized additive model
#     Neural Network    Multilayer perceptron | Ensemble of multilayer perceptrons | Neural nearest neighbours |
#                       Recurrent neural network | Convolutional neural network | Transformer
#     Baseline          Nearest neighbours | Penalized linear model | Linear regression
#     Statistical       Exponential smoothing | Theta method | ARIMA
#     Other             Kernel machine | Piecewise linear regression
#   package           the package that implements it
#   language          Julia | Python | R | C/C++ | Fortran
#
# [[models.references]] are its references: bibtex_key, a key of PollisReferences, and role, one of
# Methodology | Software | Other.

# TabArena: the 110 models of its leaderboard, each in its configuration: default, tuned, or tuned and
# ensembled. The family is TabArena's model type; the package is the one TabArena runs the model with, else the
# code its paper published.

