# The competitions of PollisCompetitions.jl: one entry each, with its files. Every competition is a Download: its
# files are fetched from their source, each checked against its SHA-256, and converted on the user's computer.
#
# `format` says how its files are read: "monash", a zip of one .tsf file of the Monash Time Series Forecasting Archive
# for each frequency, or "m4", the repository of M4. In each series of the Monash archive, the values the forecasters
# saw come first, then the `horizon` values their forecasts were scored on: so it is for the 23,000 series of M4
# Yearly, which the archive and the files of the organisers give with the same values. The `period` of a file of the
# archive is the seasonal period of its frequency, 1 for M3 Other, for which the archive gives no frequency.
#
# `papers` are keys of PollisReferences. `entries` is the number of entries whose forecasts are published, `measures`
# the measures of the scores published with them. A file plays a `role`: "series" (a frequency of the Monash archive),
# "info", "train" and "test" (the series of M4), "entries", "scores" and "forecasts" (those of an `entry`).

