# The competitions of PollisCompetitions.jl: one entry each, with its files. Every competition is a Download: its
# files are fetched from their source, each checked against its SHA-256, and converted on the user's computer.
#
# `format` says how its files are read: "monash", a zip of one .tsf file of the Monash Time Series Forecasting Archive
# for each frequency; "m4", the repository of M4; "m5", the files of the organisers of M5 on Google Drive, with the
# scores of their repository; "m6", the repository of M6. In each series of the Monash archive, the values the
# forecasters saw come first, then the `horizon` values their forecasts were scored on: so it is for the 23,000 series
# of M4 Yearly, which the archive and the files of the organisers give with the same values. The `period` of a file of
# the archive is the seasonal period of its frequency, 1 for M3 Other, for which the archive gives no frequency.
#
# `papers` are keys of PollisReferences. `entries` is the number of entries whose forecasts are published (for M6, the
# teams whose submissions are), `measures` the measures of the scores published with them. A file plays a `role`:
# "series" (a frequency of the Monash archive), "info", "train" and "test" (the series of M4 and M5), "calendar",
# "prices" and "weights" (those of M5, and the prices of the assets of M6), "submissions" (those of the teams of M6),
# "entries", "scores" and "forecasts" (those of an `entry`). The forecasts of an entry of M5 are "point" (M5 Accuracy)
# or "quantiles" (M5 Uncertainty), and an entry is a "submission", with its `rank`, or a "benchmark".

